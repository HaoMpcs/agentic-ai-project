# Only implemented routes are advertised. Sensitive routes cannot become agents.
control:
  deadline: {setting: workflow, values: [workflow]}
  office_hours: {setting: workflow, values: [workflow]}
  conceptual: {setting: agent, values: [workflow, agent]}
  repeated: {setting: workflow, values: [workflow]}
  personal: {setting: workflow, values: [workflow]}
  exception: {setting: workflow, values: [workflow]}
  unauthorized: {setting: workflow, values: [workflow]}
  ambiguous: {setting: agent, values: [workflow, agent]}
  batch: {setting: agent, values: [workflow, agent]}
plan:
  batch: {setting: "off", values: ["off", "on"]}
critique:
  reply: {setting: external, values: ["off", external]}
examples:
  flag: {setting: "off", values: ["off", "on"]}
strict:
  flag: {setting: "off", values: ["off", "on"]}
