# Only implemented routes are advertised. Sensitive routes cannot become agents.
control:
  deadline: {setting: workflow, values: [workflow]}
  office_hours: {setting: workflow, values: [workflow]}
  conceptual: {setting: agent, values: [workflow, agent]}
  repeated: {setting: workflow, values: [workflow]}
  personal: {setting: workflow, values: [workflow]}
  exception: {setting: workflow, values: [workflow]}
  unauthorized: {setting: workflow, values: [workflow]}
  ambiguous: {setting: agent, values: [workflow, agent]}
  batch: {setting: agent, values: [workflow, agent]}
plan:
  batch: {setting: "off", values: ["off", "on"]}
critique:
  reply: {setting: external, values: ["off", external]}
examples:
  flag: {setting: "off", values: ["off", "on"]}
strict:
  flag: {setting: "off", values: ["off", "on"]}
# Milestone 2 Part A switches: Jingyu Huang (CNetID: jyhuang28).
tools:
  loading:
    setting: all
    values: [all, deferred]
    added: 2026-11-21
    about: Seven model-facing domain tools fit the current surface; deferred loading is built and tested.
code_calls:
  batch:
    setting: "off"
    values: ["off", "on"]
    added: 2026-11-21
    about: At most three questions do not justify a program; the bounded capability interpreter is available for a pass.
context:
  budget:
    setting: 12000
    values: [12000]
    added: 2026-11-22
    about: Every model request counts system, messages and tool definitions before dispatch.
notes:
  compaction:
    setting: "on"
    values: ["off", "on"]
    added: 2026-11-22
    about: Long task sessions compact trusted operator selections; outside text never enters notes.
memory:
  operator_preference:
    setting: "on"
    values: ["off", "on"]
    added: 2026-11-22
    about: Explicit operator preferences persist with source provenance; student facts are excluded.
approval:
  reviewed_send:
    setting: plan
    values: [per_action, plan]
    added: 2026-11-22
    about: The selected draft, recipient, final disclosed text and sources are fixed before review, so one plan review covers its reads and exact send.
topology:
  setting: split
  values: [single, split]
  added: 2026-11-22
  about: Candidate split on m2-split; main remains single because matched diagnostics did not favor the split.
